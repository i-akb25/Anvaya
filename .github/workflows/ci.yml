name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit
      - name: Scoring, storage and privacy policy regression tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Production route and authentication deny-path checks
        run: npm run check:http
      - name: Production dependency audit
        run: npm audit --omit=dev
